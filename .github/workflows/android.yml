name: android

# PRs and pushes build a debug APK — proof the project still compiles.
# A `v*` tag builds a SIGNED release APK + AAB and attaches them to the release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Read by default; the build job widens to `write` because the tag path
# attaches the APK/AAB to the GitHub Release.
permissions:
  contents: read

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  # A doc is a doc only if no code reads it: a changed `.md`/`docs/` path that a non-doc
  # tracked file names (test, embed, build script) is reclassified as code, and the job log
  # says which file referenced it. Glob/dir reads the scan cannot see: --not-doc / --skip-job.
  docs-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          LIST=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n part
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -fsS --retry 2 -K - -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              part=$(jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp") || { why="unreadable page $page"; return 1; }
              LIST+=$part$'\n'
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          # --- reference-aware pass: a doc that code reads is code ----------------------------
          scratch=
          cleanup() { if [ -n "$scratch" ] && [ -d "$scratch" ]; then rm -rf -- "$scratch"; fi; return 0; }
          trap cleanup EXIT
          # packaging manifests name README/CHANGELOG to ship it, not to read it
          pkg_manifest() {
            case "${1##*/}" in
              Cargo.toml | Cargo.lock | package.json | package-lock.json | pnpm-lock.yaml | pyproject.toml | setup.py | setup.cfg | MANIFEST.in | composer.json | *.gemspec | Dockerfile* | .goreleaser.y*ml | release-please-config.json) return 0 ;;
            esac
            return 1
          }
          community_file() {
            case "$1" in
              README | README.* | CHANGELOG | CHANGELOG.* | CHANGES | CHANGES.* | CONTRIBUTING | CONTRIBUTING.* | CODE_OF_CONDUCT | CODE_OF_CONDUCT.* | SECURITY | SECURITY.* | LICENSE | LICENSE.* | LICENCE | LICENCE.* | COPYING | NOTICE | AUTHORS) return 0 ;;
            esac
            return 1
          }
          ref_tree() { # shallow copy of the tree CI would test (the PR merge ref) in $scratch; non-zero on any doubt
            local rev tw=
            case "$EVENT" in
              pull_request) rev="refs/pull/$PR/merge" ;;
              *) rev="$AFTER" ;;
            esac
            command -v timeout >/dev/null 2>&1 && tw="timeout 120"
            scratch=$(mktemp -d) || { why="no scratch dir"; return 1; }
            git -C "$scratch" init -q || { why="git init failed"; return 1; }
            # the token travels in the environment, never argv (/proc/<pid>/cmdline is world-readable)
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" \
              GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
              $tw git -C "$scratch" fetch -q --depth=1 --no-tags "$SERVER/$REPO.git" "$rev" || { why="tree fetch failed ($rev)"; return 1; }
          }
          # ignore lists name files to leave out, never to read
          ignore_file() {
            case "${1##*/}" in .gitignore | .dockerignore | .npmignore | .prettierignore | .eslintignore | .gitattributes | .gitleaksignore | .markdownlintignore) return 0 ;; esac
            return 1
          }
          # third-party trees carry their own README/LICENSE/CHANGELOG mentions; they never read ours
          vendored() {
            case "$1" in
              vendor/* | */vendor/* | node_modules/* | */node_modules/* | third_party/* | */third_party/*) return 0 ;;
            esac
            return 1
          }
          # Does file $1 carry $2 on a line that is code? 0 = yes, 1 = no, 2 = the check itself failed
          # (a failed reader must never read as "no": the caller turns 2 into full CI). A comment
          # line ("// see CLAUDE.md") names a doc without reading it; directives that read ARE live
          # (//go:embed, #[doc = include_str!]). An occurrence inside an http(s)/ftp URL is a link,
          # not a read. $3 = 1 (a dotless name such as LICENSE or CNAME, an English word or a bare
          # file name) additionally needs a read-ish directive on the line.
          live_mention() {
            local blob rc=0
            blob=$(git -C "$scratch" cat-file blob "FETCH_HEAD:$1") || return 2
            printf '%s\n' "$blob" | LC_ALL=C awk -v n="$2" -v strict="${3:-0}" '
              { s = $0; off = 0
                while ((i = index(s, n)) > 0) {
                  pre = substr($0, 1, off + i - 1); sub(/[A-Za-z0-9_@+.\/:~%-]*$/, "", pre)
                  tok = substr($0, length(pre) + 1, off + i - 1 - length(pre))
                  if (tok !~ /(https?|ftp):\/\//) { l = $0; sub(/^[ \t]+/, "", l)
                    # a flag line (`--config docs/x.md`) is code; only `-- ` / `--` alone is an SQL comment
                    if ((l ~ /^(\/\/go:|#\[|#!|#include|#embed|#import)/ || l !~ /^(\/\/|#|\* |\*\/|\*$|\/\*|-- |--$|<!--)/) \
                        && (strict == 0 || $0 ~ /go:embed|include_str!|include_bytes!|ReadFile|readFile|read_text|open\(|fopen|file_get_contents|File\.read|COPY|ADD/)) { found = 1; exit } }
                  off += i + length(n) - 1; s = substr(s, i + length(n)) } }
              END { exit !found }' || rc=$?
            [ "$rc" -le 1 ] || return 2
            return "$rc"
          }
          # Does a non-doc tracked file read any of the candidate docs? 0 = no, 1 = yes (why says
          # which), 2 = the scan itself failed. Any non-zero means full CI. git grep -z: the path is
          # NUL-terminated, so a ':' in a path cannot mis-cut it (NULs cannot live in a variable, hence the file).
          ref_scan() {
            local pats="$scratch/pats" out="$scratch/hits" f b pth m t bn dir stem p rc=0 lm start=$SECONDS
            declare -A seen
            : > "$pats"
            for f in "$@"; do
              b=${f##*/}
              case "$b" in
                *.*) printf '%s\n%s\n' "$f" "$b" >> "$pats" ;;
                *) printf '%s\n' "$f" >> "$pats" ;; # dotless (LICENSE, docs/CNAME): full path only, and only on a read directive
              esac
            done
            # (1) literal: the full path or the basename as a whole word. The basename is what
            # filepath.Join(root, "docs", "x.md") and read('DESIGN.md') leave in the source.
            git -C "$scratch" grep -I -z -w -F -o -f "$pats" FETCH_HEAD > "$out" || rc=$?
            [ "$rc" -le 1 ] || { why="reference scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r -d '' pth && IFS= read -r m; do
              src=${pth#FETCH_HEAD:}
              [ -z "${seen[$src|$m]:-}" ] || continue
              seen[$src|$m]=1
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
              is_doc "$src" && continue
              vendored "$src" && continue
              ignore_file "$src" && continue
              pkg_manifest "$src" && community_file "${m##*/}" && continue
              case "${m##*/}" in *.*) lm=0 ;; *) lm=1 ;; esac
              live_mention "$src" "$m" "$lm" && lm=0 || lm=$?
              case "$lm" in 0) ;; 1) continue ;; *) why="live-mention check failed for $src"; return 2 ;; esac
              why="$m treated as code: referenced by $src"
              return 1
            done < "$out"
            # (2) glob: embed/glob patterns with a literal stem (skills/d10-*.md) or a literal
            # directory (skills/*.md). Bare `*.md` / `**/*.md` come from ignore files, linters and
            # --include flags and would make every doc code: ignored, covered by --not-doc.
            rc=0
            git -C "$scratch" grep -I -z -o -E -e '[A-Za-z0-9_@+./*?-]*[*?][A-Za-z0-9_@+./*?-]*[.]mdx?' FETCH_HEAD > "$out" || rc=$?
            [ "$rc" -le 1 ] || { why="glob scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r -d '' pth && IFS= read -r t; do
              src=${pth#FETCH_HEAD:}
              [ -z "${seen[$src|$t]:-}" ] || continue
              seen[$src|$t]=1
              is_doc "$src" && continue
              vendored "$src" && continue
              bn=${t##*/}; dir=
              case "$t" in */*) dir=${t%/*} ;; esac
              stem=${bn//[*?]/}; stem=${stem%.mdx}; stem=${stem%.md}
              if [ -z "$stem" ]; then
                case "$dir" in "" | *[*?]*) continue ;; esac
              fi
              for p in "$@"; do
                case "$p" in
                  $t | */$t)
                    live_mention "$src" "$t" 0 && lm=0 || lm=$?
                    case "$lm" in 0) ;; 1) break ;; *) why="live-mention check failed for $src"; return 2 ;; esac
                    why="$t treated as code: glob in $src matches $p"
                    return 1 ;;
                esac
              done
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
            done < "$out"
            return 0
          }
          docs_only=false
          cands=()
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! touched; then
            why=${why:-listing failed}
          elif [ -z "${LIST//$'\n'/}" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if is_doc "$f"; then cands+=("$f"); else docs_only=false; why="code path: $f"; break; fi
            done <<<"$LIST"
            if [ "$docs_only" = true ]; then
              rc=0
              if ! ref_tree; then
                docs_only=false; why=${why:-tree fetch failed}
              else
                ref_scan "${cands[@]}" || rc=$?
                [ "$rc" -eq 0 ] || { docs_only=false; why=${why:-reference scan failed}; }
              fi
              [ "$docs_only" != true ] || why="${#cands[@]} doc paths, none read by code"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    permissions:
      contents: write
    # x86_64, NOT -arm. The Android SDK ships an x86-64 aapt2 and there is no
    # arm64 Linux build of it — on an aarch64 host the build dies with
    # "AAPT2 Daemon startup failed". Measured on our own arm64 box 2026-08-09.
    # Public repo ⇒ GitHub-hosted minutes are free and unlimited.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. app/build.gradle derives versionCode from
          # `git rev-list --count HEAD`. The default shallow clone makes that
          # return 1 on every run, so every release would carry versionCode=1:
          # Play rejects the second upload and a sideloaded APK refuses to
          # upgrade. Neither failure names the clone depth.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor packages
        # The Gradle build includes @capacitor/* as local projects from
        # node_modules (android/capacitor.settings.gradle), so this is a build
        # dependency, not a convenience.
        run: npm ci

      - name: Capacitor sync
        # CAP_SERVER_URL must be set — capacitor.config.ts throws if it's unset
        # to prevent dev/test builds from silently loading production content.
        # CI builds against production (the only deployed instance); release
        # tag builds set it in the Write signing config step environment.
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://oxpulse.chat' }}
        run: npx cap sync android

      # The web app switches BLE mesh on only when the shell's bluetooth-le major
      # equals the major bundled in its JS, and reads that major from the user
      # agent token written here. A mismatch is silent in production: bluetooth-le
      # 7.0 changed the hex wire format, so mismatched halves corrupt or reject
      # every BLE write without any error surfacing. Fail the build instead.
      - name: assert-ble-token (generated config)
        run: bash .github/scripts/assert-cap-token.sh

      # ── PR / branch: unsigned debug build, the compile gate ─────────────────
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      # ── Run unit tests on JVM (no emulator needed) ─────────────────────────
      # Without this step CI is synthetic-green: a broken code change compiles,
      # the APK assembles, and CI passes — even if every test would fail.
      # Instrumented tests (connectedAndroidTest) require an emulator and are
      # deferred to a follow-up; unit tests run on the JVM and catch regressions
      # in pure-Java/Kotlin logic.
      - name: Run unit tests
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew test --no-daemon --console=plain

      # ── Which AGP each project really runs ──────────────────────────────────
      # Capacitor and some plugins declare their own buildscript classpath, so
      # the root AGP version is not proof of what a library module builds with.
      # The init script prints the AGP each Android project actually loaded. The
      # project list is asserted exactly: "at least one line" would pass with
      # five of six modules silently missing.
      - name: assert-agp-runtime
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Single source of truth: the root classpath declaration.
          AGP=$(sed -nE "s/.*com\.android\.tools\.build:gradle:([0-9]+(\.[0-9]+){2}).*/\1/p" build.gradle | head -1)
          [ -n "$AGP" ] || { echo "::error::cannot read the AGP version from android/build.gradle"; exit 1; }
          ./gradlew -q --no-daemon --console=plain -I "$GITHUB_WORKSPACE/.github/scripts/agp-runtime.init.gradle" help \
            | tee /tmp/agp-runtime.txt
          grep '^AGP-RUNTIME ' /tmp/agp-runtime.txt \
            | awk '{ split($4, v, "="); print $2, $3, v[2] }' | sort > /tmp/agp-actual.txt
          # Every Android module the build includes. A new or removed module
          # fails here on purpose: update the list together with the module.
          {
            echo ":app com.android.application $AGP"
            for m in :call-reliability-lib :capacitor-android :capacitor-community-bluetooth-le \
                     :capacitor-cordova-android-plugins :mesh-core-lib; do
              echo "$m com.android.library $AGP"
            done
          } | sort > /tmp/agp-expected.txt
          if ! diff -u /tmp/agp-expected.txt /tmp/agp-actual.txt; then
            echo "::error::Android projects or their AGP differ from the expected set (- expected, + actual)"
            exit 1
          fi
          echo "  ok      $(wc -l < /tmp/agp-actual.txt) projects on AGP $AGP"

      # ── The gate that v0.1.0 needed and did not have ────────────────────────
      # A green Gradle build does NOT mean the app can start. :app had no
      # kotlin-android plugin, so its .kt sources were silently skipped and the
      # APK shipped without run.krolik.oxpulse.MainActivity — the launcher class
      # the manifest names. Signature verification passed, the release published,
      # and the app would have crashed on the first tap.
      #
      # The manifest is NOT evidence here: it names MainActivity either way. Only
      # the dex can answer it.
      - name: assert-dex-classes
        # Debug path only — on a tag the debug build is skipped, so the find
        # below would either come up empty or pick up the release APK before it
        # has been built.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: bash .github/scripts/assert-dex-classes.sh "$(find android/app/build/outputs/apk -name '*.apk' | head -1)"

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: oxpulse-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── Tag: signed release ─────────────────────────────────────────────────
      - name: Write signing config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail loudly on an unset secret. Without this the keystore file is
          # absent, build.gradle's `if (keystorePropertiesFile.exists())` guard
          # silently skips signing, and the job ships an UNSIGNED release APK
          # that looks like a successful build.
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v:-}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.jks
          # Never echo these — they are written, never printed.
          {
            # ABSOLUTE path. `storeFile file(...)` sits in app/build.gradle, and
            # Gradle resolves a relative file() against the MODULE dir, so a bare
            # "release.jks" is looked up at android/app/release.jks — not where
            # this step writes it. The failure names the wrong-but-plausible path
            # and says nothing about module-relative resolution.
            echo "storeFile=$PWD/android/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed release APK + AAB
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      - name: assert-dex-classes (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/assert-dex-classes.sh "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"

      - name: assert-r8-version (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/assert-r8-version.sh "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"

      - name: Verify the APK is actually signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          bash .github/scripts/verify-apk-signed.sh "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Shred signing material
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        run: rm -f android/release.jks android/keystore.properties

      # Whether this cut is a prerelease is decided once, by release-please
      # (release-please-config.json), which creates the GitHub Release before this
      # job runs. Read it back instead of restating it here, so promoting the
      # release with `gh release edit --prerelease=false --latest` is not undone
      # by a re-run of this job. An absent release is treated as a prerelease:
      # that hides the APK from /releases/latest until someone promotes it.
      - name: Read the release's prerelease flag
        if: startsWith(github.ref, 'refs/tags/v')
        id: relflags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if pre=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease); then
            :
          else
            echo "::notice::no release exists for $GITHUB_REF_NAME yet; creating it as a prerelease"
            pre=true
          fi
          echo "prerelease=$pre" | tee -a "$GITHUB_OUTPUT"

      # softprops/action-gh-release v2.6.2 (src/github.ts): on an existing release
      # an unset `prerelease` input keeps the release's own flag, and `make_latest`
      # is passed through to GitHub, whose documented default is `true`.
      # Both are set explicitly so the outcome does not depend on those defaults.
      # A prerelease can never be "latest", so make_latest is false for one.
      - name: Attach artefacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.relflags.outputs.prerelease }}
          make_latest: ${{ steps.relflags.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            apk-sha256.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ── Minified release on every PR ─────────────────────────────────────────────
  # Debug builds are not minified, so R8 only ever runs on a tag. This job builds
  # the real release variant with a throwaway keystore generated here (no repo
  # secrets) and asserts the same things the tag job asserts. The APK is signed
  # with a key that is discarded with the runner: never publish it.
  release-probe:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode comes from `git rev-list --count HEAD`

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Capacitor sync
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://oxpulse.chat' }}
        run: npx cap sync android

      # The web app switches BLE mesh on only when the shell's bluetooth-le major
      # equals the major bundled in its JS, and reads that major from the user
      # agent token written here. A mismatch is silent in production: bluetooth-le
      # 7.0 changed the hex wire format, so mismatched halves corrupt or reject
      # every BLE write without any error surfacing. Fail the build instead.
      - name: assert-ble-token (generated config)
        run: bash .github/scripts/assert-cap-token.sh

      - name: Generate throwaway signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -keystore android/probe.jks -storetype PKCS12 \
            -alias probe -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=throwaway probe" \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD"
          {
            echo "storeFile=$PWD/android/probe.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=probe"
            echo "keyPassword=$STORE_PASSWORD"
          } > android/keystore.properties

      - name: Build minified release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: assert-dex-classes (release probe)
        run: bash .github/scripts/assert-dex-classes.sh "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"

      - name: assert-r8-version (release probe)
        run: bash .github/scripts/assert-r8-version.sh "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"

      # Same check the tag job runs, here against the throwaway key, so a broken
      # apksigner lookup shows up on a PR instead of on a release tag.
      - name: Verify the APK is signed (release probe)
        run: bash .github/scripts/verify-apk-signed.sh "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"

      - name: Shred throwaway signing material
        if: always()
        run: rm -f android/probe.jks android/keystore.properties

      - name: Upload throwaway release APK
        uses: actions/upload-artifact@v4
        with:
          name: oxpulse-throwaway-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
