name: android

# PRs and pushes build a debug APK — proof the project still compiles.
# A `v*` tag builds a SIGNED release APK + AAB and attaches them to the release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Read by default; the build job widens to `write` because the tag path
# attaches the APK/AAB to the GitHub Release.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    # x86_64, NOT -arm. The Android SDK ships an x86-64 aapt2 and there is no
    # arm64 Linux build of it — on an aarch64 host the build dies with
    # "AAPT2 Daemon startup failed". Measured on our own arm64 box 2026-08-09.
    # Public repo ⇒ GitHub-hosted minutes are free and unlimited.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. app/build.gradle derives versionCode from
          # `git rev-list --count HEAD`. The default shallow clone makes that
          # return 1 on every run, so every release would carry versionCode=1:
          # Play rejects the second upload and a sideloaded APK refuses to
          # upgrade. Neither failure names the clone depth.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor packages
        # The Gradle build includes @capacitor/* as local projects from
        # node_modules (android/capacitor.settings.gradle), so this is a build
        # dependency, not a convenience.
        run: npm ci

      - name: Capacitor sync
        # CAP_SERVER_URL must be set — capacitor.config.ts throws if it's unset
        # to prevent dev/test builds from silently loading production content.
        # CI builds against production (the only deployed instance); release
        # tag builds set it in the Write signing config step environment.
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://oxpulse.chat' }}
        run: npx cap sync android

      # ── PR / branch: unsigned debug build, the compile gate ─────────────────
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      # ── Run unit tests on JVM (no emulator needed) ─────────────────────────
      # Without this step CI is synthetic-green: a broken code change compiles,
      # the APK assembles, and CI passes — even if every test would fail.
      # Instrumented tests (connectedAndroidTest) require an emulator and are
      # deferred to a follow-up; unit tests run on the JVM and catch regressions
      # in pure-Java/Kotlin logic.
      - name: Run unit tests
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew test --no-daemon --console=plain

      # ── Which AGP / R8 each project really resolves ──────────────────────────
      # Capacitor and some plugins declare their own buildscript classpath, so
      # the root AGP version is not proof of what a library module builds with.
      # Print the resolved build-plugin versions for the root and every
      # subproject instead of assuming.
      - name: Resolved AGP / R8 / KGP per project
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        shell: bash
        run: |
          set -uo pipefail
          for p in "" :app :capacitor-android :capacitor-community-bluetooth-le \
                   :capacitor-network :call-reliability-lib :mesh-core-lib; do
            echo "=== ${p:-<root>} buildEnvironment"
            ./gradlew -q --no-daemon --console=plain "${p}:buildEnvironment" > /tmp/be.txt \
              || { echo "::error::${p:-root}:buildEnvironment failed"; cat /tmp/be.txt; exit 1; }
            grep -E 'com\.android\.tools\.build:gradle|com\.android\.tools:r8|kotlin-gradle-plugin' /tmp/be.txt \
              | sed -E 's/^[ |+\\-]+//' | sort | uniq -c || true
          done

          # buildEnvironment shows what each buildscript DECLARES. The block below
          # shows which AGP actually ran for each project, and fails on any other
          # than the root's.
          echo "=== AGP actually applied per project"
          ./gradlew -q --no-daemon --console=plain -I "$GITHUB_WORKSPACE/.github/scripts/agp-runtime.init.gradle" help \
            | tee /tmp/agp-runtime.txt
          grep -q '^AGP-RUNTIME ' /tmp/agp-runtime.txt || { echo "::error::no AGP-RUNTIME lines printed"; exit 1; }
          if grep '^AGP-RUNTIME ' /tmp/agp-runtime.txt | grep -qv 'agp=8\.13\.2 '; then
            echo "::error::a project runs an AGP other than 8.13.2"; exit 1
          fi

      # ── The gate that v0.1.0 needed and did not have ────────────────────────
      # A green Gradle build does NOT mean the app can start. :app had no
      # kotlin-android plugin, so its .kt sources were silently skipped and the
      # APK shipped without run.krolik.oxpulse.MainActivity — the launcher class
      # the manifest names. Signature verification passed, the release published,
      # and the app would have crashed on the first tap.
      #
      # The manifest is NOT evidence here: it names MainActivity either way. Only
      # the dex can answer it.
      - name: assert-dex-classes
        # Debug path only — on a tag the debug build is skipped, so the find
        # below would either come up empty or pick up the release APK before it
        # has been built.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK to check"; exit 1; }
          unzip -o -q -p "$APK" 'classes*.dex' > /tmp/all.dex
          fail=0
          for c in MainActivity SharePackagePlugin \
                   callreliability/VoiceCallForegroundService \
                   callreliability/CallReliabilityPlugin \
                   mesh/MeshGattServerPlugin \
                   com/capacitorjs/community/plugins/bluetoothle/BluetoothLe \
                   com/capacitorjs/plugins/network/NetworkPlugin; do
            # Third-party plugins live outside run/krolik/oxpulse.
            case "$c" in com/*) fq="$c" ;; *) fq="run/krolik/oxpulse/$c" ;; esac
            if grep -aq "L$fq;" /tmp/all.dex; then
              echo "  ok      ${fq//\//.}"
            else
              echo "::error::${fq//\//.} is ABSENT from the dex — the APK cannot work"
              fail=1
            fi
          done
          exit $fail

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: oxpulse-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── Tag: signed release ─────────────────────────────────────────────────
      - name: Write signing config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail loudly on an unset secret. Without this the keystore file is
          # absent, build.gradle's `if (keystorePropertiesFile.exists())` guard
          # silently skips signing, and the job ships an UNSIGNED release APK
          # that looks like a successful build.
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v:-}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.jks
          # Never echo these — they are written, never printed.
          {
            # ABSOLUTE path. `storeFile file(...)` sits in app/build.gradle, and
            # Gradle resolves a relative file() against the MODULE dir, so a bare
            # "release.jks" is looked up at android/app/release.jks — not where
            # this step writes it. The failure names the wrong-but-plausible path
            # and says nothing about module-relative resolution.
            echo "storeFile=$PWD/android/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed release APK + AAB
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      - name: assert-dex-classes (release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK to check"; exit 1; }
          unzip -o -q -p "$APK" 'classes*.dex' > /tmp/rel.dex
          fail=0
          for c in MainActivity SharePackagePlugin \
                   callreliability/VoiceCallForegroundService \
                   callreliability/CallReliabilityPlugin \
                   mesh/MeshGattServerPlugin \
                   com/capacitorjs/community/plugins/bluetoothle/BluetoothLe \
                   com/capacitorjs/plugins/network/NetworkPlugin; do
            # Third-party plugins live outside run/krolik/oxpulse.
            case "$c" in com/*) fq="$c" ;; *) fq="run/krolik/oxpulse/$c" ;; esac
            if grep -aq "L$fq;" /tmp/rel.dex; then
              echo "  ok      ${fq//\//.}"
            else
              echo "::error::${fq//\//.} is ABSENT from the release dex"
              fail=1
            fi
          done
          exit $fail

      - name: assert-r8-version (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/assert-r8-version.sh "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"

      - name: Verify the APK is actually signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK produced"; exit 1; }
          # An unsigned APK is a plausible-looking build artefact. Assert the
          # signature exists rather than trusting the exit code above.
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Shred signing material
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        run: rm -f android/release.jks android/keystore.properties

      - name: Attach artefacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            apk-sha256.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ── Minified release on every PR ─────────────────────────────────────────────
  # Debug builds are not minified, so R8 only ever runs on a tag. This job builds
  # the real release variant with a throwaway keystore generated here (no repo
  # secrets) and asserts the same things the tag job asserts. The APK is signed
  # with a key that is discarded with the runner: never publish it.
  release-probe:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode comes from `git rev-list --count HEAD`

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Capacitor sync
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://oxpulse.chat' }}
        run: npx cap sync android

      - name: Generate throwaway signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -keystore android/probe.jks -storetype PKCS12 \
            -alias probe -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=throwaway probe" \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD"
          {
            echo "storeFile=$PWD/android/probe.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=probe"
            echo "keyPassword=$STORE_PASSWORD"
          } > android/keystore.properties

      - name: Build minified release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: assert-dex-classes (release probe)
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK to check"; exit 1; }
          ls -l "$APK"
          unzip -o -q -p "$APK" 'classes*.dex' > /tmp/rel.dex
          fail=0
          for c in MainActivity SharePackagePlugin \
                   callreliability/VoiceCallForegroundService \
                   callreliability/CallReliabilityPlugin \
                   mesh/MeshGattServerPlugin \
                   com/capacitorjs/community/plugins/bluetoothle/BluetoothLe \
                   com/capacitorjs/plugins/network/NetworkPlugin; do
            case "$c" in com/*) fq="$c" ;; *) fq="run/krolik/oxpulse/$c" ;; esac
            if grep -aq "L$fq;" /tmp/rel.dex; then
              echo "  ok      ${fq//\//.}"
            else
              echo "::error::${fq//\//.} is ABSENT from the release dex"
              fail=1
            fi
          done
          exit $fail

      - name: assert-r8-version (release probe)
        run: bash .github/scripts/assert-r8-version.sh "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"

      - name: Shred throwaway signing material
        if: always()
        run: rm -f android/probe.jks android/keystore.properties

      - name: Upload throwaway release APK
        uses: actions/upload-artifact@v4
        with:
          name: oxpulse-throwaway-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
