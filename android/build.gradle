// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Single Kotlin version for every module. Must be defined here: variables.gradle is
    // applied after buildscript{}. Capacitor's module reads rootProject.ext.kotlin_version
    // when present (else falls back to 1.9.10), so it follows this value.
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // TEMPORARY: AGP 8.2.1 bundles R8 8.2.42, which cannot read Kotlin 2.2 metadata
        // (Kotlin 2.2 needs R8 >= 8.10.21). Must be listed BEFORE the AGP classpath so it
        // wins over the bundled copy. Remove once AGP bundles R8 >= 8.10 (P2 / AGP 8.13).
        classpath 'com.android.tools:r8:8.10.21'
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
