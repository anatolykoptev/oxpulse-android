// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Single Kotlin version for every module. Must be defined here: variables.gradle is
    // applied after buildscript{}. Capacitor's module reads rootProject.ext.kotlin_version
    // when present (else falls back to 1.9.10), so it follows this value.
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
