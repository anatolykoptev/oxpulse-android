apply plugin: 'com.android.application'
// Without this the .kt sources in this module are silently NOT COMPILED. Gradle
// ignores .kt under src/main/java when the Kotlin plugin is absent, the build
// succeeds, and the APK ships without MainActivity — the launcher class the
// manifest points at. Measured on the v0.1.0 release APK: the dex string table
// held every callreliability/ and mesh/ class (those modules apply the plugin
// themselves) and neither run.krolik.oxpulse.MainActivity nor
// SharePackagePlugin. The app could not start. Nothing in the build output
// mentions the two skipped files.
apply plugin: 'kotlin-android'

// Dynamic versionCode derived from git history depth.
// FAILS the build when git is unavailable — a silent fallback to 1 produces
// an APK that Play Store rejects on the second upload and a sideloaded APK
// refuses to upgrade. Neither failure names the clone depth.
def gitCount = { ->
    try {
        return ["git", "-C", rootDir.path, "rev-list", "--count", "HEAD"].execute().text.trim().toInteger()
    } catch (Exception e) {
        throw new GradleException(
            "versionCode requires git history (fetch-depth: 0 in CI). git unavailable: ${e.message}"
        )
    }
}()

// Added to the commit count so versionCode stays monotonic across releases.
// Android refuses to install a lower versionCode over a higher one, and the
// only way back is uninstall, which wipes the WebView's IndexedDB (device
// identity). The Capacitor 6 line shipped codes below 1000; this line starts
// above them so it installs over v0.1.x in place. A maintenance release cut
// from that older line must use a larger offset (for example 2000) so it
// still installs over any build from this one. Additive rather than
// max(gitCount, 1000): max would pin every build to 1000 until the repo
// has 1000 commits, making a second release unable to upgrade the first.
def versionCodeOffset = 1000

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "run.krolik.oxpulse"
    // Explicit so the Kotlin jvmTarget below cannot mismatch Java; capacitor.build.gradle
    // sets the same but is generated and rewritten by `cap sync`.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "run.krolik.oxpulse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gitCount + versionCodeOffset
        versionName "1.0.0+" + gitCount
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // FAIL the release build if keystore.properties is absent. Without
            // this guard, signingConfigs.release has null values and Gradle
            // silently produces an UNSIGNED release APK that looks like a
            // successful build. CI checks secrets separately (android.yml), but
            // local builds do not — this is the last line of defence.
            //
            // Only check when a release task is actually requested — the
            // buildTypes block is evaluated during Gradle configuration, so
            // without this guard a debug build would also trigger the check.
            if (!keystorePropertiesFile.exists() &&
                    gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                throw new GradleException(
                    "keystore.properties not found at ${keystorePropertiesFile.absolutePath}. " +
                    "Release builds require signing material — see README.md § Signing."
                )
            }
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// kotlinOptions {} is deprecated with ERROR level since KGP 2.2; compilerOptions is the replacement.
// Fully qualified so the Groovy script needs no import.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation project(':mesh-core-lib')
    implementation project(':call-reliability-lib')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
